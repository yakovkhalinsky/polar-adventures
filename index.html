<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polar Adventures</title>
    <!-- Inline SVG favicon: the bear's head with the green scarf, so it matches
         the placeholder art. Exists mainly to satisfy the browser's automatic
         /favicon.ico request, which would otherwise 404 on every page load. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23101a2b'/><rect x='3' y='1' width='10' height='10' fill='%23F2F5F8'/><rect x='3' y='5' width='10' height='3' fill='%233AAE52'/><rect x='5' y='3' width='2' height='2' fill='%231B2430'/><rect x='10' y='3' width='2' height='2' fill='%231B2430'/></svg>"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Letterbox bars. Arctic night, so the bars read as sky. */
        background: #0a121f;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
      }

      /*
        Phaser sets `canvas.style.image-rendering = 'pixelated'` itself when
        `pixelArt: true`. That inline style wins over this rule. This block is
        belt-and-braces: it covers the frame or two before Phaser boots, and it
        means a future config change cannot silently re-enable smoothing
        without someone deleting this. `crisp-edges` first so `pixelated` is
        the winning declaration.
      */
      #game-container canvas {
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
