<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polar Adventures</title>
    <!-- Inline SVG favicon: the bear's head, in the sliced art's own colours
         (cream fur #E8D8B8, navy outline #1E222D, sky #101A2B). Exists mainly
         to satisfy the browser's automatic /favicon.ico request, which would
         otherwise 404 on every page load. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23101a2b'/><rect x='2' y='2' width='4' height='4' fill='%23E8D8B8'/><rect x='10' y='2' width='4' height='4' fill='%23E8D8B8'/><rect x='3' y='4' width='10' height='9' fill='%23E8D8B8'/><rect x='5' y='7' width='2' height='2' fill='%231E222D'/><rect x='9' y='7' width='2' height='2' fill='%231E222D'/><rect x='7' y='10' width='2' height='2' fill='%231E222D'/></svg>"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Letterbox bars. Arctic night, so the bars read as sky. */
        background: #0a121f;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
      }

      /*
        Phaser sets `canvas.style.image-rendering = 'pixelated'` itself when
        `pixelArt: true`. That inline style wins over this rule. This block is
        belt-and-braces: it covers the frame or two before Phaser boots, and it
        means a future config change cannot silently re-enable smoothing
        without someone deleting this. `crisp-edges` first so `pixelated` is
        the winning declaration.
      */
      #game-container canvas {
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
